<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Piece Tracker Pro</title>
    
    <!-- Meta & Styles -->
    <meta name="theme-color" content="#2c1b0e">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root {
            --gold: #ffcc00;
            --bg: #0a1118;
            --wood: #2c1b0e;
            --accent: #d9411e;
            --border: #4a3728;
            --card-bg: #162130;
            --input-bg: #0d141d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: #f0f0f0;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.2rem;
            background: var(--wood);
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 1rem; padding-bottom: 100px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h2 { color: var(--gold); font-size: 1rem; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 1px; border-left: 3px solid var(--gold); padding-left: 10px; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid #2d3748;
            color: var(--gold);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }

        /* Checkboxes compactos */
        .options-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
        }

        .btn-main { background: var(--accent); color: white; box-shadow: 0 4px 0 #8b2610; }
        .btn-sub { background: #334155; color: #cbd5e1; box-shadow: 0 4px 0 #1e293b; font-size: 0.75rem; }
        button:active { transform: translateY(2px); box-shadow: none; }

        /* Estado & Progreso */
        .stat-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 5px 0; }
        .stat-row b { color: var(--gold); }
        .date-highlight { color: var(--accent) !important; font-weight: bold; }

        .bar-bg { height: 12px; background: #000; border-radius: 20px; overflow: hidden; margin: 12px 0; border: 1px solid #2d3748; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #d9411e, #ffcc00); transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        .badge-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 15px; }
        .badge { font-size: 0.65rem; padding: 4px 8px; border: 1px solid #2d3748; border-radius: 4px; color: #4a5568; }
        .badge.earned { border-color: var(--gold); color: var(--gold); background: rgba(255,204,0,0.05); }

        /* Sidebar simple */
        .sidebar { position: fixed; left: -100%; top: 0; width: 280px; height: 100%; background: var(--wood); z-index: 1000; transition: 0.3s; border-right: 2px solid var(--gold); padding: 20px; box-sizing: border-box; }
        .sidebar.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 999; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

<header>
    <div onclick="toggleMenu()" style="cursor:pointer; color:var(--gold)">☠️ Bitácora</div>
    <div style="font-weight: bold;">OP <span style="color:var(--gold)">TRACKER</span></div>
</header>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div id="sidebar" class="sidebar">
    <h3 style="color:var(--gold)">Mapa de Arcos</h3>
    <div id="arc-list"></div>
</div>

<div class="container">
    <!-- Bloque Tripulación -->
    <div class="card">
        <h2>Tripulación</h2>
        <input type="text" id="username" placeholder="Nombre de tu barco..." maxlength="15">
    </div>

    <!-- Bloque Navegación -->
    <div class="card">
        <h2>Navegación</h2>
        <div class="grid">
            <div class="input-group">
                <label>Capítulo Actual</label>
                <input type="number" id="actual" value="0" onchange="syncFromInput()">
            </div>
            <div class="input-group">
                <label>Meta diaria</label>
                <input type="number" id="diarios" value="3">
            </div>
        </div>

        <div class="options-row">
            <label class="check-item">
                <input type="checkbox" id="skipIntro" onchange="calcular()"> <span>Sin Openings</span>
            </label>
            <label class="check-item">
                <input type="checkbox" id="skipEnding" onchange="calcular()"> <span>Sin Endings</span>
            </label>
        </div>

        <button class="btn-main" id="btn-update">Actualizar Bitácora</button>
        <button class="btn-sub" onclick="resetData()">Resetear Datos Locales</button>
    </div>

    <!-- Bloque Estado -->
    <div class="card">
        <h2>Estado</h2>
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <span id="pct-label" style="font-size: 0.8rem; font-weight: bold; color: var(--gold);">0%</span>
            <span>🚢</span>
        </div>
        <div class="bar-bg"><div id="bar" class="bar-fill"></div></div>

        <div class="stat-row"><span>Restantes:</span> <b id="res-rest">0</b></div>
        <div class="stat-row"><span>Tiempo total:</span> <b id="res-time">0h 0m</b></div>
        <div class="stat-row"><span>Fecha estimada:</span> <b id="res-date" class="date-highlight">-</b></div>

        <div id="badges-div" class="badge-container"></div>
    </div>

    <!-- Bloque Ranking -->
    <div class="card" style="padding: 12px;">
        <h2 style="font-size: 0.9rem;">🏆 Top Recompensas</h2>
        <div id="ranking-body" style="font-size: 0.8rem;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBcfDO9ncqW9o7UtIexJXOwD4KAsKuL-hY",
        authDomain: "onepiececalc-8db51.firebaseapp.com",
        projectId: "onepiececalc-8db51",
        storageBucket: "onepiececalc-8db51.firebasestorage.app",
        messagingSenderId: "8459238492",
        appId: "1:8459238492:web:73f0f2d6834db58e3e3a99"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TOTAL = 1159;

    window.toggleMenu = () => {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    };

    window.syncFromInput = () => { calcular(); };

    window.calcular = async function() {
        const actual = parseInt(document.getElementById("actual").value) || 0;
        const diarios = parseInt(document.getElementById("diarios").value) || 1;
        const name = document.getElementById("username").value.trim() || "Pirata";
        
        const restantes = Math.max(0, TOTAL - actual);
        let mins = 23;
        if(document.getElementById("skipIntro").checked) mins -= 5;
        if(document.getElementById("skipEnding").checked) mins -= 3;

        const totalMin = restantes * mins;
        const fecha = new Date();
        fecha.setDate(fecha.getDate() + Math.ceil(restantes / diarios));

        document.getElementById("res-rest").textContent = restantes;
        document.getElementById("res-time").textContent = Math.floor(totalMin/60) + "h " + (totalMin%60) + "m";
        document.getElementById("res-date").textContent = restantes > 0 ? fecha.toLocaleDateString() : "¡FIN!";
        
        const pct = Math.round((actual / TOTAL) * 100);
        document.getElementById("bar").style.width = pct + "%";
        document.getElementById("pct-label").textContent = pct + "%";

        updateBadges(actual);

        if(name !== "Pirata" && actual > 0) {
            await setDoc(doc(db, "ranking", name), { name, pct, bounty: actual * 1350000 });
        }
    };

    function updateBadges(a) {
        const list = [{v:1,t:"Grumete"},{v:100,t:"Novato"},{v:517,t:"Nuevo Mundo"},{v:890,t:"Yonko"},{v:TOTAL,t:"Rey"}];
        document.getElementById("badges-div").innerHTML = list.map(m => `<span class="badge ${a>=m.v?'earned':''}">${m.t}</span>`).join('');
    }

    onSnapshot(query(collection(db, "ranking"), orderBy("bounty", "desc"), limit(5)), (snap) => {
        let h = "";
        snap.forEach(d => {
            const p = d.data();
            h += `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #2d3748;">
                <span>${p.name}</span> <span style="color:#00ff00; font-family:monospace;">฿${p.bounty.toLocaleString()}</span>
            </div>`;
        });
        document.getElementById("ranking-body").innerHTML = h;
    });

    document.getElementById('btn-update').onclick = calcular;
    window.onload = calcular;
</script>
</body>
</html>
