<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece Tracker Pro</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1836624801202112" crossorigin="anonymous"></script>

<style>
:root {
--gold:#ffcc00;
--bg:#0a1118;
--wood:#2c1b0e;
--accent:#d9411e;
--border:#4a3728;
--card-bg:#162130;
--text:#f0f0f0;
}

/* MODO CLARO */
.light {
--bg:#f4f4f4;
--wood:#ffffff;
--card-bg:#ffffff;
--text:#111;
--border:#ccc;
}

body {
margin:0;
font-family:sans-serif;
background:var(--bg);
color:var(--text);
transition:0.3s;
}

/* HEADER */
header {
display:flex;
justify-content:space-between;
align-items:center;
padding:1rem;
background:var(--wood);
border-bottom:3px solid var(--gold);
}

.theme-btn {
background:var(--accent);
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar {
position:fixed;
left:-100%;
top:0;
width:300px;
height:100%;
background:var(--wood);
transition:0.4s;
z-index:1000;
overflow-y:auto;
}

.sidebar.active { left:0; }

.overlay {
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
}

.overlay.active { display:block; }

/* BUSCADOR */
.search-box {
padding:10px;
border-bottom:1px solid var(--gold);
}

/* ARCOS */
.arc { border-bottom:1px solid var(--border); }

.arc-header {
padding:14px;
cursor:pointer;
display:flex;
justify-content:space-between;
color:var(--gold);
}

.arc-header small {
transition:0.3s;
}

.arc.open small { transform:rotate(180deg); }

.cap-list {
max-height:0;
overflow:hidden;
transition:0.4s;
}

.arc.open .cap-list {
max-height:250px;
overflow:auto;
}

.cap-item {
padding:8px;
cursor:pointer;
transition:0.2s;
}

.cap-item:hover {
background:rgba(255,255,255,0.1);
color:var(--gold);
}

/* CONTENIDO */
.container {
max-width:500px;
margin:auto;
padding:1rem 1rem 120px;
}

.card {
background:var(--card-bg);
border:1px solid var(--border);
border-radius:12px;
padding:18px;
margin-bottom:15px;
}

h2 {
color:var(--gold);
margin-bottom:10px;
}

input {
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #2d3748;
background:#0d141d;
color:var(--gold);
}

button {
width:100%;
padding:14px;
background:var(--accent);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.bar-bg {
height:12px;
background:#000;
border-radius:20px;
overflow:hidden;
margin:10px 0;
}

.bar-fill {
height:100%;
width:0%;
background:linear-gradient(90deg,#d9411e,#ffcc00);
transition:1s;
}
</style>
</head>

<body>

<header>
<div onclick="toggleMenu()">☠️ ARCOS</div>
<div>OP TRACKER</div>
<button class="theme-btn" onclick="toggleTheme()">Modo</button>
</header>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">

<div class="search-box">
<input type="text" placeholder="Buscar capítulo..." oninput="buscarCap(this.value)">
</div>

<div id="arc-list"></div>
</div>

<div class="container">

<div class="card">
<h2>Capítulo Actual</h2>
<input type="number" id="actual" value="0">
<button onclick="calcular()">Calcular</button>
</div>

<div class="card">
<h2>Progreso</h2>
<div id="pct">0%</div>
<div class="bar-bg"><div id="bar" class="bar-fill"></div></div>
<div>Restantes: <span id="restantes">0</span></div>
<div>Tiempo estimado: <span id="tiempo">0h</span></div>
<div>Fecha: <span id="fecha">-</span></div>
</div>

</div>

<script>
const TOTAL = 1159;

const ARCS = [
{n:"East Blue",s:1,e:61},
{n:"Alabasta",s:62,e:135},
{n:"Skypiea",s:136,e:206},
{n:"Water 7",s:207,e:325},
{n:"Thriller Bark",s:326,e:384},
{n:"Wano",s:890,e:1085},
{n:"Egghead",s:1086,e:TOTAL}
];

function toggleMenu(){
sidebar.classList.toggle("active");
overlay.classList.toggle("active");
}

function toggleArc(el){
document.querySelectorAll(".arc").forEach(a=>{
if(a!==el.parentElement) a.classList.remove("open");
});
el.parentElement.classList.toggle("open");
}

function initArcs(){
const list=document.getElementById("arc-list");

ARCS.forEach(arc=>{
const div=document.createElement("div");
div.className="arc";

div.innerHTML=`
<div class="arc-header" onclick="toggleArc(this)">
<span>${arc.n}</span><small>▼</small>
</div>
<div class="cap-list">
${Array.from({length:arc.e-arc.s+1},(_,i)=>{
let n=arc.s+i;
return `<div class="cap-item" data-name="capitulo ${n}" onclick="selectCap(${n})">Capítulo ${n}</div>`;
}).join("")}
</div>
`;

list.appendChild(div);
});
}

function selectCap(n){
document.getElementById("actual").value=n;
toggleMenu();
}

/* BUSCADOR */
function buscarCap(txt){
txt=txt.toLowerCase();
document.querySelectorAll(".cap-item").forEach(el=>{
el.style.display = el.dataset.name.includes(txt) ? "block":"none";
});
}

/* CALCULO COMPLETO */
function calcular(){
let actual=parseInt(document.getElementById("actual").value)||0;
let restantes = TOTAL - actual;

let pct=Math.round((actual/TOTAL)*100);
document.getElementById("pct").textContent=pct+"%";
document.getElementById("bar").style.width=pct+"%";

document.getElementById("restantes").textContent=restantes;

let tiempo = restantes * 23;
document.getElementById("tiempo").textContent = Math.floor(tiempo/60)+"h "+(tiempo%60)+"m";

let fecha = new Date();
fecha.setDate(fecha.getDate() + Math.ceil(restantes/3));
document.getElementById("fecha").textContent = fecha.toLocaleDateString();
}

/* MODO CLARO */
function toggleTheme(){
document.body.classList.toggle("light");
localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark");
}

window.onload=()=>{
initArcs();

let t=localStorage.getItem("theme");
if(t==="light") document.body.classList.add("light");
};
</script>

</body>
</html>
