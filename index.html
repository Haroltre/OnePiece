<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Piece Tracker Pro</title>
    
    <!-- Meta para PWA (Instalar como App) -->
    <meta name="theme-color" content="#2c1b0e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --gold: #ffcc00;
            --bg: #0a1118;
            --wood: #2c1b0e;
            --accent: #d9411e;
            --border: #4a3728;
            --card-bg: rgba(15, 23, 42, 0.95);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at center, #1a2a3a 0%, #0a1118 100%);
            color: #f0f0f0;
            min-height: 100vh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: var(--wood);
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--gold);
        }

        /* SIDEBAR PROFESIONAL */
        .sidebar {
            position: fixed;
            left: -100%;
            top: 0;
            width: 320px;
            height: 100%;
            background: var(--wood);
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            transition: 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--gold);
        }

        .sidebar.active { left: 0; }

        .sidebar-header {
            padding: 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .arc-container { flex: 1; overflow-y: auto; padding: 15px; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 999;
        }

        .overlay.active { display: block; }

        /* ARCOS */
        .arc { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 5px; margin-bottom: 8px; }
        .arc-header { padding: 12px; cursor: pointer; color: var(--gold); font-weight: bold; display: flex; justify-content: space-between; }
        .list { display: none; padding: 10px; background: rgba(0,0,0,0.3); max-height: 300px; overflow-y: auto; }
        .arc.open .list { display: block; }

        /* MAIN */
        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; padding-bottom: 100px; }
        .card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

        input[type="number"] {
            width: 100%; padding: 12px; margin: 8px 0; background: #0a1118; border: 1px solid var(--border);
            color: var(--gold); border-radius: 4px; box-sizing: border-box; font-size: 16px;
        }

        button {
            width: 100%; padding: 14px; background: var(--accent); color: white; border: none;
            border-radius: 4px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #8b2610; margin-top: 10px;
        }

        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #8b2610; }

        /* PROGRESO */
        .progress-box { margin: 20px 0; }
        .bar-bg { height: 15px; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: 1.2s ease; }

        .stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* BADGES */
        .badge { display: inline-block; padding: 5px 10px; margin: 3px; font-size: 0.7rem; background: #000; border: 1px solid #333; border-radius: 4px; color: #555; transition: 0.3s; }
        .badge.earned { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 8px rgba(255,204,0,0.2); }

        /* BANNER PUBLICITARIO */
        .ad-banner {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--wood);
            border-top: 2px solid var(--gold); z-index: 2000; min-height: 60px; text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☠️ <span style="font-size: 1rem">Bitácora</span></div>
    <div style="font-weight: bold; letter-spacing: 1px;">OP <span style="color:var(--gold)">TRACKER</span></div>
</header>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3 style="margin:0; color:var(--gold)">Mapa de Arcos</h3>
        <span style="cursor:pointer; font-size: 1.5rem;" onclick="toggleMenu()">✖</span>
    </div>
    <div id="arc-list" class="arc-container"></div>
</div>

<div class="container">
    <div class="card">
        <div class="grid">
            <div class="controls">
                <h2 style="color:var(--gold); font-size: 1.2rem; margin:0">Navegación</h2>
                <label style="font-size: 0.8rem;">Capítulo Actual</label>
                <input type="number" id="actual" value="0" onchange="syncFromInput()">
                
                <label style="font-size: 0.8rem;">Capítulos diarios</label>
                <input type="number" id="diarios" value="3">

                <div style="margin: 10px 0; font-size: 0.9rem;">
                    <label><input type="checkbox" id="skipIntro" onchange="calcular()"> Sin Openings</label><br>
                    <label><input type="checkbox" id="skipEnding" onchange="calcular()"> Sin Endings</label>
                </div>

                <button onclick="calcular()">Calcular Rumbo</button>
                <button onclick="resetData()" style="background:#444; box-shadow: 0 4px 0 #222; font-size: 0.7rem;">Resetear Datos</button>
            </div>

            <div class="stats">
                <h2 style="color:var(--gold); font-size: 1.2rem; margin:0">Estado</h2>
                <div class="progress-box">
                    <div style="display:flex; justify-content:space-between; font-size: 0.8rem; margin-bottom: 5px;">
                        <span id="pct-label">0%</span>
                        <span>🚢</span>
                    </div>
                    <div class="bar-bg"><div id="bar" class="bar-fill"></div></div>
                </div>

                <div class="stat-line"><span>Restantes:</span> <b id="res-rest" style="color:var(--gold)">0</b></div>
                <div class="stat-line"><span>Tiempo:</span> <b id="res-time">0h</b></div>
                <div class="stat-line"><span>Fecha:</span> <b id="res-date" style="color:var(--accent)">-</b></div>
            </div>
        </div>
        <div id="badges-div" style="margin-top:20px;"></div>
    </div>
</div>

<!-- Banner de Anuncio -->
<div class="ad-banner">
    <small style="color: #888; font-size: 9px; display: block;">PUBLICIDAD</small>
    <!-- Remplaza este div con tu código de AdSense cuando lo tengas -->
    <div id="ad-placeholder" style="color: #555; padding-top: 10px; font-size: 12px;">
        Espacio para Banner de Google
    </div>
</div>

<script>
const TOTAL = 1159;
const ARCS = [
    {n: "East Blue", s: 1, e: 61}, {n: "Alabasta", s: 62, e: 135},
    {n: "Skypiea", s: 136, e: 206}, {n: "Water 7 / Enies Lobby", s: 207, e: 325},
    {n: "Thriller Bark", s: 326, e: 384}, {n: "Guerra en la Cumbre", s: 385, e: 516},
    {n: "Isla Gyojin", s: 517, e: 574}, {n: "Punk Hazard", s: 575, e: 628},
    {n: "Dressrosa", s: 629, e: 750}, {n: "Zou", s: 751, e: 782},
    {n: "Whole Cake Island", s: 783, e: 889}, {n: "Wano Kuni", s: 890, e: 1085},
    {n: "Isla Egghead", s: 1086, e: TOTAL}
];

function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

function initArcs() {
    const list = document.getElementById("arc-list");
    ARCS.forEach(arc => {
        const div = document.createElement("div");
        div.className = "arc";
        div.innerHTML = `
            <div class="arc-header" onclick="this.parentElement.classList.toggle('open')">
                <span>${arc.n}</span><small>▼</small>
            </div>
            <div class="list">
                ${Array.from({length: arc.e - arc.s + 1}, (_, i) => {
                    const n = arc.s + i;
                    return `<div style="padding:5px"><label><input type="checkbox" class="cap-check" data-id="${n}" onchange="syncFromCheck(${n})"> Cap ${n}</label></div>`;
                }).join('')}
            </div>
        `;
        list.appendChild(div);
    });
}

function syncFromCheck(n) {
    document.getElementById("actual").value = n;
    updateChecks(n);
    calcular();
}

function syncFromInput() {
    let n = parseInt(document.getElementById("actual").value) || 0;
    if(n > TOTAL) n = TOTAL;
    updateChecks(n);
    calcular();
}

function updateChecks(n) {
    document.querySelectorAll('.cap-check').forEach(c => c.checked = parseInt(c.dataset.id) <= n);
}

function calcular() {
    const actual = parseInt(document.getElementById("actual").value) || 0;
    const diarios = parseInt(document.getElementById("diarios").value) || 1;
    const restantes = Math.max(0, TOTAL - actual);
    
    let mins = 23;
    if(document.getElementById("skipIntro").checked) mins -= 5;
    if(document.getElementById("skipEnding").checked) mins -= 3;

    const totalMin = restantes * mins;
    const horas = Math.floor(totalMin / 60);
    const dias = restantes / diarios;
    
    const fecha = new Date();
    fecha.setDate(fecha.getDate() + Math.ceil(dias));

    document.getElementById("res-rest").textContent = restantes;
    document.getElementById("res-time").textContent = horas + "h " + (totalMin % 60) + "m";
    document.getElementById("res-date").textContent = restantes > 0 ? fecha.toLocaleDateString() : "¡FIN DEL VIAJE!";
    
    const pct = Math.round((actual / TOTAL) * 100);
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("pct-label").textContent = pct + "% completado";

    updateBadges(actual);
    localStorage.setItem("op_data_final", JSON.stringify({actual, diarios, si: document.getElementById("skipIntro").checked, se: document.getElementById("skipEnding").checked}));
}

function updateBadges(a) {
    const list = [{v: 1, t: "Grumete"}, {v: 100, t: "Novato"}, {v: 517, t: "Nuevo Mundo"}, {v: 890, t: "Yonko"}, {v: TOTAL, t: "Rey"}];
    document.getElementById("badges-div").innerHTML = list.map(m => `<span class="badge ${a >= m.v ? 'earned' : ''}">${m.t}</span>`).join('');
}

function resetData() {
    if(confirm("¿Reiniciar bitácora?")) { localStorage.clear(); location.reload(); }
}

window.onload = () => {
    initArcs();
    const data = JSON.parse(localStorage.getItem("op_data_final"));
    if(data) {
        document.getElementById("actual").value = data.actual;
        document.getElementById("diarios").value = data.diarios;
        document.getElementById("skipIntro").checked = data.si;
        document.getElementById("skipEnding").checked = data.se;
        updateChecks(data.actual);
    }
    calcular();
};
</script>
</body>
</html>
