<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Piece Tracker Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #d9411e;
            --gold: #ffcc00;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --sidebar-bg: #111827;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --radius: 12px;
        }

        .light {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --sidebar-bg: #f8fafc;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 800;
            font-size: 1rem;
            color: var(--gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- SIDEBAR REFORMADO --- */
        .sidebar {
            position: fixed;
            left: -100%;
            top: 0;
            width: 85%;
            max-width: 300px;
            height: 100%;
            background: var(--sidebar-bg);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active { left: 0; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 1000;
        }

        .overlay.active { display: block; }

        #arc-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 1rem;
            padding-right: 5px;
        }

        /* --- ARCOS --- */
        .arc-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
        }

        .arc-header {
            padding: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .cap-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .arc-card.open .cap-grid { max-height: 300px; padding: 8px; overflow-y: auto; }

        .cap-btn-small {
            background: var(--border);
            border: none;
            color: var(--text-main);
            padding: 6px 2px;
            border-radius: 4px;
            font-size: 0.7rem;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-container {
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        /* TAMAÑO DE TEXTO ADAPTATIVO */
        #pct-display {
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 800;
            color: var(--primary);
            margin: 0.5rem 0;
            line-height: 1;
        }

        .stat-label { 
            color: var(--text-dim); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: block;
        }

        .stat-value { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-top: 4px;
            word-break: break-word; /* Evita que el texto largo rompa la caja */
        }

        /* BARRA PROGRESO */
        .progress-wrapper {
            background: #000;
            height: 10px;
            border-radius: 10px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--gold));
            transition: width 0.8s ease;
        }

        /* INPUTS Y BOTONES */
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--gold);
            font-size: 1rem;
            margin-top: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }

        /* GRID DE STATS INFERIOR */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="toggleMenu()">☠️ ARCOS</div>
        <button onclick="toggleTheme()" style="background:none; border:1px solid var(--border); color:var(--text-main); padding:5px 10px; border-radius:5px; font-size: 12px;">🌓 Tema</button>
    </header>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <aside id="sidebar" class="sidebar">
        <h3 style="margin: 0 0 1rem 0; font-size: 1.2rem;">Arcos</h3>
        <input type="text" placeholder="Buscar..." oninput="buscarCap(this.value)" style="margin-bottom: 1rem; font-size: 14px;">
        <div id="arc-list"></div>
    </aside>

    <main class="main-container">
        
        <div class="card" style="text-align: center;">
            <span class="stat-label">Progreso General</span>
            <div id="pct-display">0%</div>
            <div class="progress-wrapper">
                <div id="bar" class="progress-bar"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);">
                <span id="label-actual">Capítulo: 0</span>
                <span>Meta: 1159</span>
            </div>
        </div>

        <div class="card">
            <span class="stat-label">¿En qué capítulo estás?</span>
            <input type="number" id="actual-input" placeholder="0">
            <button class="btn-primary" onclick="calcular()">ACTUALIZAR</button>
        </div>

        <div class="stats-grid">
            <div class="card">
                <span class="stat-label">Restantes</span>
                <span class="stat-value" id="res-val">--</span>
            </div>
            <div class="card">
                <span class="stat-label">Días para terminar</span>
                <span class="stat-value" id="date-val">--</span>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <span class="stat-label">Tiempo total de visualización</span>
                <span class="stat-value" id="time-val">--</span>
            </div>
        </div>
    </main>

<script>
    const DATA = {
        total: 1159,
        minPerCap: 22,
        arcs: [
            {n:"East Blue", s:1, e:61},
            {n:"Alabasta", s:62, e:135},
            {n:"Skypiea", s:136, e:206},
            {n:"Water 7 / Enies Lobby", s:207, e:325},
            {n:"Thriller Bark", s:326, e:384},
            {n:"Summit War", s:385, e:516},
            {n:"Fish-Man Island", s:517, e:574},
            {n:"Punk Hazard", s:575, e:622},
            {n:"Dressrosa", s:623, e:746},
            {n:"Zou / Whole Cake", s:747, e:889},
            {n:"Wano Kuni", s:890, e:1085},
            {n:"Egghead", s:1086, e:1159}
        ]
    };

    function init() {
        const list = document.getElementById('arc-list');
        DATA.arcs.forEach(arc => {
            const div = document.createElement('div');
            div.className = 'arc-card';
            let caps = '';
            for(let i=arc.s; i<=arc.e; i+=5) { // Saltos de 5 para no saturar el móvil
                caps += `<button class="cap-btn-small" onclick="selectCap(${i})">${i}</button>`;
            }
            div.innerHTML = `
                <div class="arc-header" onclick="this.parentElement.classList.toggle('open')">
                    ${arc.n} <span>▼</span>
                </div>
                <div class="cap-grid">${caps}</div>
            `;
            list.appendChild(div);
        });

        const saved = localStorage.getItem('op-cap');
        if(saved) {
            document.getElementById('actual-input').value = saved;
            calcular();
        }
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function selectCap(n) {
        document.getElementById('actual-input').value = n;
        calcular();
        toggleMenu();
    }

    function calcular() {
        const val = parseInt(document.getElementById('actual-input').value) || 0;
        localStorage.setItem('op-cap', val);

        const res = DATA.total - val;
        const pct = ((val / DATA.total) * 100).toFixed(1);

        document.getElementById('pct-display').textContent = pct + '%';
        document.getElementById('bar').style.width = pct + '%';
        document.getElementById('label-actual').textContent = 'Capítulo: ' + val;
        document.getElementById('res-val').textContent = res + ' caps';
        
        const totalMin = res * DATA.minPerCap;
        const hours = Math.floor(totalMin / 60);
        document.getElementById('time-val').textContent = hours + ' horas aprox.';

        const days = Math.ceil(res / 3); // Promedio 3 caps/día
        document.getElementById('date-val').textContent = days + ' días';
    }

    function toggleTheme() {
        document.body.classList.toggle('light');
    }

    function buscarCap(q) {
        document.querySelectorAll('.arc-card').forEach(el => {
            el.style.display = el.textContent.toLowerCase().includes(q.toLowerCase()) ? 'block' : 'none';
        });
    }

    window.onload = init;
</script>
</body>
</html>
