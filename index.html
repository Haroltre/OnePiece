<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Piece Tracker Pro</title>
    
    <!-- AdSense & Meta -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1836624801202112" crossorigin="anonymous"></script>
    <meta name="theme-color" content="#2c1b0e">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root { --gold: #ffcc00; --bg: #0a1118; --wood: #2c1b0e; --accent: #d9411e; --border: #4a3728; --card-bg: rgba(15, 23, 42, 0.95); }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: #f0f0f0; touch-action: manipulation; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: var(--wood); border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .container { max-width: 800px; margin: 1rem auto; padding: 0 1rem 120px 1rem; }
        .card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 5px 0; background: #000; border: 1px solid var(--border); color: var(--gold); border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #8b2610; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #8b2610; }
        .bar-bg { height: 14px; background: #000; border-radius: 10px; margin: 15px 0; border: 1px solid var(--border); }
        .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: 1s ease-in-out; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: var(--gold); text-align: left; padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
        td { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .bounty { color: #00ff00; font-family: monospace; font-weight: bold; text-align: right; }
        
        .ad-banner { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--wood); border-top: 2px solid var(--gold); min-height: 60px; text-align: center; z-index: 2000; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--gold); font-weight: bold;">☠️ Bitácora</div>
    <div style="font-weight:bold; letter-spacing: 1px;">OP <span style="color:var(--gold)">TRACKER</span></div>
</header>

<div class="container">
    <!-- Identidad -->
    <div class="card">
        <h2 style="color:var(--gold); margin:0 0 10px 0; font-size: 1.1rem;">Tu Tripulación</h2>
        <input type="text" id="username" placeholder="Nombre de tu barco..." maxlength="15">
    </div>

    <!-- Progreso -->
    <div class="card">
        <h2 style="color:var(--gold); font-size: 1.1rem; margin-top: 0;">Rumbo Actual</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label style="font-size:0.7rem">Capítulo Actual</label>
                <input type="number" id="actual" value="0">
            </div>
            <div>
                <label style="font-size:0.7rem">Meta diaria</label>
                <input type="number" id="diarios" value="3">
            </div>
        </div>
        <div class="bar-bg"><div id="bar" class="bar-fill"></div></div>
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
            <span>Restantes: <b id="res-rest" style="color:var(--gold)">0</b></span>
            <span>Finaliza: <b id="res-date" style="color:var(--accent)">-</b></span>
        </div>
        <button id="btn-update">Actualizar Recompensa</button>
    </div>

    <!-- Clasificación -->
    <div class="card">
        <h2 style="color:var(--gold); font-size: 1.1rem; margin-top: 0;">🏆 Ranking de Recompensas</h2>
        <table>
            <thead><tr><th>Pos</th><th>Pirata</th><th>%</th><th style="text-align:right">Bounty (฿)</th></tr></thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>
</div>

<div class="ad-banner">
    <small style="color:#888; font-size:9px">PUBLICIDAD</small>
    <div style="padding-top: 5px; color: #444;">Espacio para Banner</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    // Tu configuración (Screenshot_20260503_125616.jpg)
    const firebaseConfig = {
        apiKey: "AIzaSyBcfDO9ncqW9o7UtIexJXOwD4KAsKuL-hY",
        authDomain: "onepiececalc-8db51.firebaseapp.com",
        projectId: "onepiececalc-8db51",
        storageBucket: "onepiececalc-8db51.firebasestorage.app",
        messagingSenderId: "8459238492",
        appId: "1:8459238492:web:73f0f2d6834db58e3e3a99"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TOTAL = 1159;

    const btnUpdate = document.getElementById('btn-update');
    const rankingBody = document.getElementById('ranking-body');

    // Lógica de cálculo y guardado
    async function updateData() {
        const actual = parseInt(document.getElementById("actual").value) || 0;
        const diarios = parseInt(document.getElementById("diarios").value) || 1;
        const name = document.getElementById("username").value.trim() || "Pirata Errante";
        
        const restantes = Math.max(0, TOTAL - actual);
        const pct = Math.round((actual / TOTAL) * 100);
        const bounty = actual * 1250000; // ฿1.25M por capítulo visto

        // UI local
        document.getElementById("res-rest").textContent = restantes;
        document.getElementById("bar").style.width = pct + "%";
        const fecha = new Date();
        fecha.setDate(fecha.getDate() + Math.ceil(restantes / diarios));
        document.getElementById("res-date").textContent = restantes > 0 ? fecha.toLocaleDateString() : "¡EL REY!";

        // Guardar en Firestore
        try {
            await setDoc(doc(db, "ranking", name), {
                name, pct, bounty, lastUpdate: new Date()
            });
            localStorage.setItem("op_user", name);
            localStorage.setItem("op_caps", actual);
        } catch (e) { console.error("Error guardando:", e); }
    }

    // Escuchar el ranking en tiempo real
    const q = query(collection(db, "ranking"), orderBy("bounty", "desc"), limit(8));
    onSnapshot(q, (snapshot) => {
        let html = "";
        let i = 1;
        snapshot.forEach(doc => {
            const p = doc.data();
            html += `<tr>
                <td style="color:var(--gold)">#${i++}</td>
                <td style="font-weight:bold">${p.name}</td>
                <td style="color:#888">${p.pct}%</td>
                <td class="bounty">${p.bounty.toLocaleString()}</td>
            </tr>`;
        });
        rankingBody.innerHTML = html;
    });

    btnUpdate.addEventListener('click', updateData);

    // Cargar datos previos del navegador
    window.onload = () => {
        const savedName = localStorage.getItem("op_user");
        const savedCaps = localStorage.getItem("op_caps");
        if(savedName) document.getElementById("username").value = savedName;
        if(savedCaps) document.getElementById("actual").value = savedCaps;
        updateData();
    };
</script>
</body>
</html>
