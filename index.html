<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Piece Tracker Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #d9411e;
            --gold: #ffcc00;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --sidebar-bg: #111827;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --radius: 12px;
        }

        .light {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --sidebar-bg: #f8fafc;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { font-weight: 800; color: var(--gold); cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* SIDEBAR COMPLETO */
        .sidebar {
            position: fixed;
            left: -100%;
            top: 0;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: var(--sidebar-bg);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active { left: 0; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 1000;
        }

        .overlay.active { display: block; }

        .search-container { padding: 1.5rem 1.5rem 0.5rem; }

        #arc-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.5rem 1.5rem;
        }

        /* ARCOS Y BOTONES 1x1 */
        .arc-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
        }

        .arc-header {
            padding: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .cap-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            background: #00000033;
        }

        .arc-card.open .cap-grid { 
            max-height: 400px; 
            padding: 10px; 
            overflow-y: auto; 
        }

        .cap-btn-item {
            background: var(--border);
            border: none;
            color: var(--text-main);
            padding: 8px 0;
            border-radius: 4px;
            font-size: 0.75rem;
            text-align: center;
        }

        .cap-btn-item:active { background: var(--primary); }

        /* MAIN */
        .main-container { padding: 1rem; max-width: 600px; margin: 0 auto; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        #pct-display {
            font-size: clamp(2.5rem, 12vw, 4.5rem);
            font-weight: 800;
            color: var(--primary);
            margin: 0.5rem 0;
            line-height: 1;
        }

        .stat-label { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.1rem; font-weight: 600; display: block; margin-top: 4px; }

        .progress-wrapper { background: #000; height: 10px; border-radius: 10px; margin: 1.2rem 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--gold)); transition: 1s ease; }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--gold);
            font-size: 1rem;
            margin-top: 8px;
            outline: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: 800;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        @media (max-width: 400px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="toggleMenu()">☠️ VER ARCOS</div>
        <button onclick="toggleTheme()" style="background:none; border:1px solid var(--border); color:var(--text-main); padding:6px 12px; border-radius:6px; font-size: 12px;">🌓 Tema</button>
    </header>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <aside id="sidebar" class="sidebar">
        <div class="search-container">
            <h3 style="margin: 0 0 10px 0;">Todos los Arcos</h3>
            <input type="text" placeholder="Buscar arco o capítulo..." oninput="buscarCap(this.value)">
        </div>
        <div id="arc-list"></div>
    </aside>

    <main class="main-container">
        <div class="card" style="text-align: center;">
            <span class="stat-label">Progreso del Viaje</span>
            <div id="pct-display">0%</div>
            <div class="progress-wrapper"><div id="bar" class="progress-bar"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);">
                <span id="label-actual">Capítulo: 0</span>
                <span>Meta: 1159</span>
            </div>
        </div>

        <div class="card">
            <span class="stat-label">Tu posición actual</span>
            <input type="number" id="actual-input" placeholder="Ingresa capítulo">
            <button class="btn-primary" onclick="calcular()">Actualizar Datos</button>
        </div>

        <div class="stats-grid">
            <div class="card">
                <span class="stat-label">Restantes</span>
                <span id="res-val" class="stat-value">--</span>
            </div>
            <div class="card">
                <span class="stat-label">Días (3 cap/día)</span>
                <span id="date-val" class="stat-value">--</span>
            </div>
        </div>
    </main>

<script>
    const DATA = {
        total: 1159,
        arcs: [
            {n:"East Blue", s:1, e:61},
            {n:"Filler: Apis", s:54, e:60}, // Algunos fillers están solapados o son mini-arcos
            {n:"Entrada Grand Line", s:62, e:77},
            {n:"Isla Drum", s:78, e:91},
            {n:"Alabasta", s:92, e:130},
            {n:"Post-Alabasta (Filler)", s:131, e:143},
            {n:"Isla del Cielo (Skypiea)", s:144, e:206},
            {n:"G-8 (Filler)", s:207, e:228},
            {n:"Long Ring Long Land", s:229, e:263},
            {n:"Water 7", s:264, e:312},
            {n:"Enies Lobby", s:313, e:336},
            {n:"Post-Enies Lobby", s:337, e:384},
            {n:"Thriller Bark", s:385, e:456},
            {n:"Sabaody Archipelago", s:457, e:489},
            {n:"Amazon Lily", s:490, e:516},
            {n:"Impel Down", s:517, e:549},
            {n:"Marineford", s:550, e:574},
            {n:"3D2Y (Post-Guerra)", s:575, e:622},
            {n:"Isla Gyojin", s:623, e:653},
            {n:"Punk Hazard", s:654, e:746},
            {n:"Dressrosa", s:747, e:889},
            {n:"Zou", s:890, e:916},
            {n:"Whole Cake Island", s:917, e:1085},
            {n:"Levely", s:1086, e:1096},
            {n:"Wano Kuni", s:1097, e:1150},
            {n:"Egghead", s:1151, e:1159}
        ]
    };

    function init() {
        const list = document.getElementById('arc-list');
        DATA.arcs.forEach(arc => {
            const div = document.createElement('div');
            div.className = 'arc-card';
            let caps = '';
            // AQUÍ APARECEN TODOS 1 POR 1
            for(let i=arc.s; i<=arc.e; i++) {
                caps += `<button class="cap-btn-item" onclick="selectCap(${i})">${i}</button>`;
            }
            div.innerHTML = `
                <div class="arc-header" onclick="toggleArc(this)">
                    ${arc.n} <span style="font-size:10px">▼</span>
                </div>
                <div class="cap-grid">${caps}</div>
            `;
            list.appendChild(div);
        });

        const saved = localStorage.getItem('op-cap-v2');
        if(saved) {
            document.getElementById('actual-input').value = saved;
            calcular();
        }
    }

    function toggleArc(el) {
        const card = el.parentElement;
        const isOpen = card.classList.contains('open');
        document.querySelectorAll('.arc-card').forEach(c => c.classList.remove('open'));
        if(!isOpen) card.classList.add('open');
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function selectCap(n) {
        document.getElementById('actual-input').value = n;
        calcular();
        toggleMenu();
    }

    function calcular() {
        const val = parseInt(document.getElementById('actual-input').value) || 0;
        localStorage.setItem('op-cap-v2', val);

        const res = Math.max(0, DATA.total - val);
        const pct = ((val / DATA.total) * 100).toFixed(1);

        document.getElementById('pct-display').textContent = pct + '%';
        document.getElementById('bar').style.width = pct + '%';
        document.getElementById('label-actual').textContent = 'Capítulo: ' + val;
        document.getElementById('res-val').textContent = res + ' capítulos';
        document.getElementById('date-val').textContent = Math.ceil(res / 3) + ' días';
    }

    function toggleTheme() { document.body.classList.toggle('light'); }

    function buscarCap(q) {
        const query = q.toLowerCase();
        document.querySelectorAll('.arc-card').forEach(el => {
            const match = el.textContent.toLowerCase().includes(query);
            el.style.display = match ? 'block' : 'none';
        });
    }

    window.onload = init;
</script>
</body>
</html>
