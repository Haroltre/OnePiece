<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Piece Tracker Pro</title>
    
    <!-- AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1836624801202112" crossorigin="anonymous"></script>
    <meta name="theme-color" content="#2c1b0e">

    <style>
        :root { --gold: #ffcc00; --bg: #0a1118; --wood: #2c1b0e; --accent: #d9411e; --border: #4a3728; --card-bg: #162130; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: #f0f0f0; }
        
        header { display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: var(--wood); border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        
        .sidebar { position: fixed; left: -100%; top: 0; width: 300px; height: 100%; background: var(--wood); transition: 0.4s; z-index: 1000; border-right: 2px solid var(--gold); overflow-y: auto; }
        .sidebar.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 999; }
        .overlay.active { display: block; }

        .arc { border-bottom: 1px solid var(--border); }
        .arc-header { padding: 15px; cursor: pointer; color: var(--gold); font-weight: bold; display: flex; justify-content: space-between; background: rgba(0,0,0,0.2); }
        .cap-list { display: none; padding: 10px; background: rgba(0,0,0,0.4); }
        .arc.open .cap-list { display: block; }

        .container { max-width: 500px; margin: 0 auto; padding: 1rem 1rem 120px 1rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 15px; }
        
        h2 { color: var(--gold); font-size: 1rem; margin: 0 0 12px 0; border-left: 3px solid var(--gold); padding-left: 10px; }
        input { width: 100%; padding: 12px; background: #0d141d; border: 1px solid #2d3748; color: var(--gold); border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        
        .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; }

        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--accent); color: white; box-shadow: 0 4px 0 #8b2610; margin-bottom: 10px; }
        .btn-reset { background: #334155; color: #cbd5e1; font-size: 0.7rem; }

        .bar-bg { height: 12px; background: #000; border-radius: 20px; overflow: hidden; margin: 12px 0; border: 1px solid #2d3748; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #d9411e, #ffcc00); transition: 1s; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        td { padding: 10px 0; border-bottom: 1px solid #2d3748; }
        .bounty { color: #00ff00; font-family: monospace; text-align: right; font-weight: bold; }

        .ad-banner { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--wood); border-top: 2px solid var(--gold); text-align: center; padding: 5px 0; z-index: 2000; }
    </style>
</head>
<body>

<header>
    <div onclick="toggleMenu()" style="cursor:pointer; color:var(--gold); font-weight: bold;">☠️ ARCOS</div>
    <div style="font-weight: bold;">OP <span style="color:var(--gold)">TRACKER</span></div>
</header>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div id="sidebar" class="sidebar">
    <div style="padding: 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--gold);">
        <h3 style="margin:0; color:var(--gold)">Mapa de Arcos</h3>
    </div>
    <div id="arc-list"></div>
</div>

<div class="container">
    <div class="card">
        <h2>Tripulación</h2>
        <input type="text" id="username" placeholder="Nombre de tu barco..." maxlength="15">
    </div>

    <div class="card">
        <h2>Navegación</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label style="font-size:0.7rem; color:#888">Capítulo Actual</label>
                <input type="number" id="actual" value="0" onchange="syncFromInput()">
            </div>
            <div>
                <label style="font-size:0.7rem; color:#888">Meta Diaria</label>
                <input type="number" id="diarios" value="3">
            </div>
        </div>
        <div class="options-row">
            <label class="check-item"><input type="checkbox" id="skipIntro" onchange="calcular()"> <span>Sin Intros</span></label>
            <label class="check-item"><input type="checkbox" id="skipEnding" onchange="calcular()"> <span>Sin Endings</span></label>
        </div>
        <button class="btn-main" id="btn-update">Actualizar Bitácora</button>
        <button class="btn-reset" onclick="resetData()">Eliminar Datos Locales</button>
    </div>

    <div class="card">
        <h2>Estado</h2>
        <div style="display:flex; justify-content: space-between; font-size: 0.8rem;">
            <span id="pct-label" style="color: var(--gold); font-weight: bold;">0%</span>
            <span>🚢</span>
        </div>
        <div class="bar-bg"><div id="bar" class="bar-fill"></div></div>
        <div style="font-size: 0.85rem; line-height: 1.8;">
            <div>Restantes: <b id="res-rest" style="color:var(--gold)">0</b></div>
            <div>Tiempo: <b id="res-time">0h 0m</b></div>
            <div>Fecha Estimada: <b id="res-date" style="color:var(--accent)">-</b></div>
        </div>
    </div>

    <div class="card">
        <h2>🏆 Ranking Mundial</h2>
        <table><tbody id="ranking-body"></tbody></table>
    </div>
</div>

<div class="ad-banner">
    <small style="color: #888; font-size: 9px; display: block;">PUBLICIDAD</small>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1836624801202112" data-ad-slot="XXXXXXXXXX" data-ad-format="auto"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBcfDO9ncqW9o7UtIexJXOwD4KAsKuL-hY",
        authDomain: "onepiececalc-8db51.firebaseapp.com",
        projectId: "onepiececalc-8db51",
        storageBucket: "onepiececalc-8db51.firebasestorage.app",
        messagingSenderId: "8459238492",
        appId: "1:8459238492:web:73f0f2d6834db58e3e3a99"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TOTAL = 1159;

    const ARCS = [
        {n: "East Blue", s: 1, e: 61}, {n: "Alabasta", s: 62, e: 135}, {n: "Skypiea", s: 136, e: 206},
        {n: "Water 7", s: 207, e: 325}, {n: "Thriller Bark", s: 326, e: 384}, {n: "Guerra Cumbre", s: 385, e: 516},
        {n: "Isla Gyojin", s: 517, e: 574}, {n: "Dressrosa", s: 629, e: 750}, {n: "Wano", s: 890, e: 1085}, {n: "Egghead", s: 1086, e: TOTAL}
    ];

    window.toggleMenu = () => {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    };

    window.initArcs = () => {
        const list = document.getElementById("arc-list");
        ARCS.forEach(arc => {
            const div = document.createElement("div");
            div.className = "arc";
            div.innerHTML = `
                <div class="arc-header" onclick="this.parentElement.classList.toggle('open')">
                    <span>${arc.n}</span><small>▼</small>
                </div>
                <div class="cap-list">
                    ${Array.from({length: arc.e - arc.s + 1}, (_, i) => {
                        const n = arc.s + i;
                        return `<div style="padding:5px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.8rem; cursor:pointer" onclick="selectCap(${n})">Capítulo ${n}</div>`;
                    }).join('')}
                </div>`;
            list.appendChild(div);
        });
    };

    window.selectCap = (n) => {
        document.getElementById("actual").value = n;
        calcular();
        toggleMenu();
    };

    window.syncFromInput = () => { calcular(); };

    window.calcular = async function() {
        const actual = parseInt(document.getElementById("actual").value) || 0;
        const diarios = parseInt(document.getElementById("diarios").value) || 1;
        const name = document.getElementById("username").value.trim() || "Pirata";
        
        const restantes = Math.max(0, TOTAL - actual);
        let mins = 23;
        if(document.getElementById("skipIntro").checked) mins -= 5;
        if(document.getElementById("skipEnding").checked) mins -= 3;

        const totalMin = restantes * mins;
        const fecha = new Date();
        fecha.setDate(fecha.getDate() + Math.ceil(restantes / diarios));

        document.getElementById("res-rest").textContent = restantes;
        document.getElementById("res-time").textContent = Math.floor(totalMin/60) + "h " + (totalMin%60) + "m";
        document.getElementById("res-date").textContent = restantes > 0 ? fecha.toLocaleDateString() : "¡EL REY!";
        
        const pct = Math.round((actual / TOTAL) * 100);
        document.getElementById("bar").style.width = pct + "%";
        document.getElementById("pct-label").textContent = pct + "%";

        localStorage.setItem("op_data", JSON.stringify({actual, name, diarios}));

        if(name !== "Pirata" && actual > 0) {
            await setDoc(doc(db, "ranking", name), { name, pct, bounty: actual * 1350000 });
        }
    };

    window.resetData = () => {
        if(confirm("¿Seguro que quieres borrar tus datos?")) {
            localStorage.clear();
            location.reload();
        }
    };

    onSnapshot(query(collection(db, "ranking"), orderBy("bounty", "desc"), limit(10)), (snap) => {
        let h = "";
        let i = 1;
        snap.forEach(d => {
            const p = d.data();
            h += `<tr><td style="color:#888; width:30px">#${i++}</td><td style="font-weight:bold">${p.name}</td><td class="bounty">฿${p.bounty.toLocaleString()}</td></tr>`;
        });
        document.getElementById("ranking-body").innerHTML = h;
    });

    document.getElementById('btn-update').onclick = calcular;
    window.onload = () => {
        initArcs();
        const saved = JSON.parse(localStorage.getItem("op_data"));
        if(saved) {
            document.getElementById("actual").value = saved.actual;
            document.getElementById("username").value = saved.name;
            document.getElementById("diarios").value = saved.diarios;
        }
        calcular();
    };
</script>
</body>
</html>
