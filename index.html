<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Piece Tracker Pro</title>
    
    <meta name="theme-color" content="#2c1b0e">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root {
            --gold: #ffcc00;
            --bg: #0a1118;
            --wood: #2c1b0e;
            --accent: #d9411e;
            --border: #4a3728;
            --card-bg: #162130;
            --input-bg: #0d141d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: #f0f0f0;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.2rem;
            background: var(--wood);
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            border-bottom: 3px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 1rem; padding-bottom: 100px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }

        h2 { color: var(--gold); font-size: 1rem; margin: 0 0 12px 0; text-transform: uppercase; border-left: 3px solid var(--gold); padding-left: 10px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid #2d3748;
            color: var(--gold);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }

        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-main { background: var(--accent); color: white; box-shadow: 0 4px 0 #8b2610; }
        .btn-sub { background: #334155; color: #cbd5e1; font-size: 0.75rem; }

        .bar-bg { height: 12px; background: #000; border-radius: 20px; overflow: hidden; margin: 12px 0; border: 1px solid #2d3748; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #d9411e, #ffcc00); transition: 1s; }

        /* Sidebar & Arcos */
        .sidebar { position: fixed; left: -100%; top: 0; width: 280px; height: 100%; background: var(--wood); z-index: 1000; transition: 0.3s; border-right: 2px solid var(--gold); padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .sidebar.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 999; }
        .overlay.active { display: block; }
        .arc-item { padding: 10px; border-bottom: 1px solid rgba(255,204,0,0.1); font-size: 0.9rem; cursor: pointer; }
        .arc-item:hover { color: var(--gold); }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        td { padding: 8px 0; border-bottom: 1px solid #2d3748; }
        .bounty-text { color: #00ff00; font-family: monospace; text-align: right; }
    </style>
</head>
<body>

<header>
    <div onclick="toggleMenu()" style="cursor:pointer; color:var(--gold)">☠️ Arcos</div>
    <div style="font-weight: bold;">OP <span style="color:var(--gold)">TRACKER</span></div>
</header>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div id="sidebar" class="sidebar">
    <h3 style="color:var(--gold)">Mapa de Arcos</h3>
    <div id="arc-list"></div>
</div>

<div class="container">
    <div class="card">
        <h2>Tripulación</h2>
        <input type="text" id="username" placeholder="Nombre de tu barco..." maxlength="15">
    </div>

    <div class="card">
        <h2>Navegación</h2>
        <div class="grid">
            <div><label style="font-size:0.7rem; color:#888">Capítulo Actual</label><input type="number" id="actual" value="0"></div>
            <div><label style="font-size:0.7rem; color:#888">Meta Diaria</label><input type="number" id="diarios" value="3"></div>
        </div>
        <div class="options-row">
            <label class="check-item"><input type="checkbox" id="skipIntro"> <span>Sin Intro</span></label>
            <label class="check-item"><input type="checkbox" id="skipEnding"> <span>Sin Final</span></label>
        </div>
        <button class="btn-main" id="btn-update">Actualizar Bitácora</button>
    </div>

    <div class="card">
        <h2>Estado</h2>
        <div style="display:flex; justify-content: space-between; font-size: 0.8rem;">
            <span id="pct-label" style="color: var(--gold);">0%</span>
            <span>🚢</span>
        </div>
        <div class="bar-bg"><div id="bar" class="bar-fill"></div></div>
        <div style="font-size: 0.85rem; line-height: 1.6;">
            <div>Restantes: <b id="res-rest" style="color:var(--gold)">0</b></div>
            <div>Fecha Estimada: <b id="res-date" style="color:var(--accent)">-</b></div>
        </div>
    </div>

    <div class="card">
        <h2>🏆 Ranking Pirata</h2>
        <table>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBcfDO9ncqW9o7UtIexJXOwD4KAsKuL-hY",
        authDomain: "onepiececalc-8db51.firebaseapp.com",
        projectId: "onepiececalc-8db51",
        storageBucket: "onepiececalc-8db51.firebasestorage.app",
        messagingSenderId: "8459238492",
        appId: "1:8459238492:web:73f0f2d6834db58e3e3a99"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TOTAL = 1159;

    const ARCS = [
        {n: "East Blue", s: 1}, {n: "Alabasta", s: 62}, {n: "Skypiea", s: 136}, {n: "Water 7", s: 207},
        {n: "Thriller Bark", s: 326}, {n: "Guerra Cumbre", s: 385}, {n: "Isla Gyojin", s: 517}, 
        {n: "Dressrosa", s: 629}, {n: "Wano", s: 890}, {n: "Egghead", s: 1086}
    ];

    window.toggleMenu = () => {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    };

    function initArcs() {
        const list = document.getElementById("arc-list");
        ARCS.forEach(arc => {
            const div = document.createElement("div");
            div.className = "arc-item";
            div.textContent = arc.n + " (Cap. " + arc.s + ")";
            div.onclick = () => {
                document.getElementById("actual").value = arc.s;
                calcular();
                toggleMenu();
            };
            list.appendChild(div);
        });
    }

    async function calcular() {
        const actual = parseInt(document.getElementById("actual").value) || 0;
        const diarios = parseInt(document.getElementById("diarios").value) || 1;
        const name = document.getElementById("username").value.trim() || "Pirata";
        
        const restantes = Math.max(0, TOTAL - actual);
        const fecha = new Date();
        fecha.setDate(fecha.getDate() + Math.ceil(restantes / diarios));

        document.getElementById("res-rest").textContent = restantes;
        document.getElementById("res-date").textContent = restantes > 0 ? fecha.toLocaleDateString() : "¡FIN!";
        
        const pct = Math.min(100, Math.round((actual / TOTAL) * 100));
        document.getElementById("bar").style.width = pct + "%";
        document.getElementById("pct-label").textContent = pct + "%";

        if(name !== "Pirata" && actual > 0) {
            try {
                await setDoc(doc(db, "ranking", name), { 
                    name, pct, bounty: actual * 1350000, lastUpdate: new Date() 
                });
            } catch (e) { console.error("Error Firebase:", e); }
        }
    }

    onSnapshot(query(collection(db, "ranking"), orderBy("bounty", "desc"), limit(10)), (snap) => {
        let h = "";
        let i = 1;
        snap.forEach(d => {
            const p = d.data();
            h += `<tr>
                <td style="color:#888; width:30px">#${i++}</td>
                <td style="font-weight:bold">${p.name}</td>
                <td class="bounty-text">฿${(p.bounty || 0).toLocaleString()}</td>
            </tr>`;
        });
        document.getElementById("ranking-body").innerHTML = h;
    });

    document.getElementById('btn-update').onclick = calcular;
    window.onload = () => { initArcs(); calcular(); };
</script>
</body>
</html>
